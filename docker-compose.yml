
services:
  postgres:
    image: postgres:16-alpine
    container_name: ground_handling_db
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: 1337
      POSTGRES_DB: ground_handling
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
          test: [ "CMD-SHELL", "pg_isready -U admin -d ground_handling" ]
          interval: 5s
          timeout: 3s
          retries: 5
    restart: unless-stopped

volumes:
  postgres_data: