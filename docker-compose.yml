version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: ground_handling_db
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: 1337
      POSTGRES_DB: ground_handling
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  postgres_data: